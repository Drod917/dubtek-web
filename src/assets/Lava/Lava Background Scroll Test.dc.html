<!DOCTYPE html>
<html>
<head>

</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0b0716"/><circle cx="50" cy="62" r="17" fill="#ffb020"/><circle cx="38" cy="34" r="9" fill="#ff3a2e"/><circle cx="64" cy="28" r="6" fill="#ffe9a3"/></svg></template>
<x-dc>
<helmet>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060f; overflow: hidden; }
  a { color: #ffb020; }
  a:hover { color: #ffe9a3; }
</style>
</helmet>
<div style="position: fixed; inset: 0; background: #05060f">
  <canvas ref="{{ canvasRef }}" style="display: block; width: 100%; height: 100%"></canvas>
  <div style="position: absolute; right: 22px; bottom: 20px; display: flex; gap: 10px; align-items: center">
    <span style="font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.34)">{{ statusLabel }}</span>
    <button onClick="{{ onRecord }}" style="appearance: none; border: 1px solid rgba(255,255,255,0.18); background: rgba(8,10,26,0.42); color: rgba(255,255,255,0.72); backdrop-filter: blur(8px); border-radius: 999px; padding: 9px 16px; cursor: pointer; font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.14em; text-transform: uppercase" style-hover="border-color: rgba(255,255,255,0.42); color: #fff">{{ recordLabel }}</button>
    <button onClick="{{ onDownload }}" style="appearance: none; border: 1px solid rgba(255,255,255,0.18); background: rgba(8,10,26,0.42); color: rgba(255,255,255,0.72); backdrop-filter: blur(8px); border-radius: 999px; padding: 9px 16px; cursor: pointer; font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.14em; text-transform: uppercase" style-hover="border-color: rgba(255,255,255,0.42); color: #fff">Save 2560 × 1440</button>
  </div>
</div>
<sc-if value="{{ scrollMode }}" hint-placeholder-val="{{ false }}">
  <div style="position: relative; z-index: 2">
    <div id="scrollRunway" style="height: 200vh"></div>
    <section style="min-height: 100vh; background: #05060f; border-top: 1px solid rgba(255,255,255,0.10); display: grid; place-items: center; padding: 80px 40px">
      <p style="margin: 0; max-width: 30ch; text-align: center; font: 400 15px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; color: rgba(255,255,255,0.42); text-wrap: pretty">Page content goes here — the bubbles cover the screen, then this slides up over them.</p>
    </section>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Ember&quot;,&quot;Magenta&quot;,&quot;Ultraviolet&quot;,&quot;Iridescent&quot;,&quot;Medal&quot;],&quot;default&quot;:&quot;Ember&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;blobCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:9,&quot;min&quot;:3,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.55,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;bubbleAmount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Bubbles&quot;},&quot;scrollTransition&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Bubbles&quot;},&quot;saturation&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Colour&quot;},&quot;spectrum&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:-0.5,&quot;max&quot;:0.5,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Colour&quot;},&quot;warmReach&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1.8,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Colour&quot;},&quot;warmSmooth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Colour&quot;},&quot;rimGlow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1.8,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;glowSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:6,&quot;min&quot;:2,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Glow&quot;},&quot;glowIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:3,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Glow&quot;},&quot;edgeBlur&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.02,&quot;min&quot;:0,&quot;max&quot;:0.4,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Glow&quot;},&quot;shine&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.8,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Glow&quot;},&quot;bgLift&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.22,&quot;min&quot;:0,&quot;max&quot;:0.8,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;bgSpread&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.5,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;bgVignette&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;loopSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:8,&quot;max&quot;:120,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Export&quot;},&quot;exportQuality&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;1080p&quot;,&quot;1440p&quot;,&quot;4K&quot;,&quot;Badge 360² (mp4)&quot;],&quot;default&quot;:&quot;1440p&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Export&quot;}}">
const PALETTES = {
  Ember: { stops: ['ffe9a3','ffb020','ff3a2e','d0186a','4a2fd0','0b1550'], bg: ['05081c','010207'] },
  Magenta: { stops: ['ffe2ec','ff5fa8','ff1f5e','c01050','6a0a3a','2a0518'], bg: ['1d0310','080105'] },
  Ultraviolet: { stops: ['ffd0a0','ff6a4a','ff2f4f','b02ad0','5a2ee0','2a1ab0'], bg: ['160c58','050220'] },
  Iridescent: { stops: ['eafcff','58efff','9a5cff','ff3fa2','ff6a2a','07070c'], bg: ['0b0a14','000000'] },
  Medal: { stops: ['f7e2ff','ffb3f0','7ee8ff','3aa8ff','5b3fd6','07060f'], bg: ['0a0912','000000'] }
};

const VERT = `#version 300 es
in vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform vec3 uBalls[96];
uniform int uCount;
uniform float uRim;
uniform vec3 uStops[6];
uniform vec3 uBg[2];
uniform vec2 uLdir[96];
uniform float uGlowSize;
uniform float uGlowInt;
uniform float uSoft;
uniform float uShine;
uniform float uTime;
uniform float uLift;
uniform float uSpread;
uniform float uVign;
uniform float uTwF;
uniform float uSat;
uniform float uSpec;
uniform float uWarm;
uniform float uSmooth;

float h21(vec2 x){ return fract(sin(dot(x, vec2(41.3, 289.1))) * 43758.5453); }

vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + 1e-10)), d / (q.x + 1e-10), q.x);
}
vec3 hsv2rgb(vec3 c){
  vec3 p = abs(fract(c.xxx + vec3(0.0, 2.0/3.0, 1.0/3.0)) * 6.0 - 3.0);
  return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}

vec3 ramp(float s){
  const float p0=0.0, p1=0.03, p2=0.16, p3=0.36, p4=0.62, p5=1.0;
  vec3 c = uStops[0];
  c = mix(c, uStops[1], smoothstep(p0, p1, s));
  c = mix(c, uStops[2], smoothstep(p1, p2, s));
  c = mix(c, uStops[3], smoothstep(p2, p3, s));
  c = mix(c, uStops[4], smoothstep(p3, p4, s));
  c = mix(c, uStops[5], smoothstep(p4, p5, s));
  // manual colour controls. Saturation scales chroma without touching value, so the shading
  // structure survives at either extreme. Spectrum fans hue across the ramp itself — stops
  // rotate progressively by depth, pivoting mid-ramp so the palette's identity stays put
  // while the rim and core pull apart into a rainbow.
  if (abs(uSat - 1.0) > 0.001 || abs(uSpec) > 0.001) {
    vec3 h = rgb2hsv(c);
    h.x = fract(h.x + uSpec * (s - 0.35));
    h.y = clamp(h.y * uSat, 0.0, 1.0);
    c = hsv2rgb(h);
  }
  return c;
}

void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float f = 0.0;
  float fs = 0.0;
  float wsum = 0.0;
  float rw = 0.0;
  float fm = 0.0;
  float spill = 0.0;
  vec2 g = vec2(0.0);
  float gs = 0.0;
  float litB = 0.0;
  vec2 ldir = vec2(0.0);
  for (int i = 0; i < 96; i++){
    if (i >= uCount) break;
    // a ball squeezed to zero radius (a bubble held back by the clearing line) would make
    // R2 zero and turn the gradient term into 0/0 — one NaN there poisons every pixel
    if (uBalls[i].z <= 1e-4) continue;
    vec2 d = p - uBalls[i].xy;
    float R2 = 4.0 * uBalls[i].z * uBalls[i].z;
    // real lava-lamp wax is never a circle: buoyancy stretches a drop along its rise and
    // surface tension only slowly pulls it back. Each drop gets a stable seed from its index
    // (position would make the shape flicker as it moves) driving a slow anisotropic stretch
    // plus a low-order angular wobble, so it reads as a soft deforming teardrop.
    float sd1 = h21(vec2(float(i) * 1.37, 7.1));
    float sd2 = h21(vec2(float(i) * 2.11, 3.3));
    float ph = sd1 * 6.283 + uTime * (0.06 + 0.05 * sd2);
    // axis rotates freely so no drop is pinned to one orientation, and the stretch is mild —
    // enough to break the circle without squishing the body
    float ax = sd1 * 6.283 + 0.35 * sin(ph * 0.7);
    float el = 0.02 + 0.032 * sd2 + 0.018 * sin(ph);
    vec2 dr = vec2(d.x * cos(ax) + d.y * sin(ax), -d.x * sin(ax) + d.y * cos(ax));
    dr = vec2(dr.x * (1.0 + el), dr.y / (1.0 + el));
    // wobble the effective radius by angle: a gentle 3-lobe ripple, never enough to pinch
    float th = atan(dr.y, dr.x);
    R2 *= 1.0 + 0.032 * sin(3.0 * th + ph * 1.3) + 0.022 * sin(2.0 * th - ph);
    d = dr;
    float dd = dot(d, d);
    float q = max(0.0, 1.0 - dd / R2);
    float w3 = q * q * q * q;
    // union weight: w3^1.25 (see the reduce below). Every per-blob quantity rides this same
    // weight — including the gradient — so nothing switches abruptly between neighbours.
    float w2 = w3 * pow(w3, 0.08);
    f += w2;
    ldir += w2 * uLdir[i];
    wsum += w2;
    rw += w2 * uBalls[i].z;
    // the gradient must be pulled back into screen space: d has been rotated by ax and
    // stretched, so a raw gradient here lives in each drop's own warped frame and nrm ends up
    // rotated by an arbitrary per-drop angle. Chain rule: apply the transpose of the forward
    // warp (scale, then rotate by -ax) to this drop's gradient contribution.
    vec2 gw = -8.0 * q * q * q * d / R2;
    gw = vec2(gw.x * (1.0 + el), gw.y / (1.0 + el));
    vec2 gws = vec2(gw.x * cos(ax) - gw.y * sin(ax), gw.x * sin(ax) + gw.y * cos(ax));
    g += w2 * gws;
    gs += w2 * length(gw);
    // each drop's own light term, blended by the same smooth weight as everything else. The
    // merged normal flips across a few pixels at every junction; this average cannot.
    float gli = length(gws);
    litB += w2 * (gli > 1e-6 ? -gws.y / gli : 0.0);
    float cq = max(0.0, 1.0 - dd / (R2 * uGlowSize));
    // brightest single contributor, not the sum — otherwise a big swarm washes the frame
    spill = max(spill, cq * cq * cq);
  }

  // p-norm soft union at p=1.08. p=2 over q^4 weights made this an eighth-power norm, which
  // behaves almost exactly like max(): the isosurface met itself at an angle and the colour
  // bands cusped into a V at every junction. A low p is a genuinely soft blend — necks fill
  // out as rounded fillets and the bands sweep through in one continuous curve. Still above
  // p=1, so a crowd of weak tails cannot sum its way into a phantom surface.
  f = pow(f, 0.926);
  g /= max(f, 1e-4);
  gs /= max(f, 1e-4);
  fm = f;

  const float T = 0.36;
  float vign = clamp(length(p * vec2(0.62, 1.0)) * 0.9 * uVign, 0.0, 1.0);
  float lift = smoothstep(mix(-0.15, 1.30, uSpread), -0.55, p.y);
  vec3 col = mix(uBg[0], uBg[1], vign) + mix(uBg[0], vec3(1.0), 0.25) * lift * uLift;
  col += ramp(0.30) * min(spill, 1.0) * 0.085 * uGlowInt;
  col += ramp(0.12) * smoothstep(0.06, T, fm) * 0.20 * uRim;

  // colour follows depth below the surface of the merged mass, not any single blob's own
  // profile — per-blob profiles put an indigo island over every centre with pink in the gaps,
  // which read as mottled. The union field is ~T at the surface and ~1 at a drop's core, so
  // this sweeps the full ramp rim-to-core for any drop, whatever its size.
  float s = clamp((f - T) / (0.95 - T), 0.0, 1.0);
  // small bubbles get far less directional shading and rim: on a tiny drop the gradient is
  // steep and the surface band wide relative to its body, which would turn it wholly pale
  float rAvg = rw / max(wsum, 1e-5);
  float litScale = mix(0.18, 1.0, smoothstep(0.035, 0.14, rAvg));
  float gl = length(g);
  // coherence: 1 on a single drop's convex surface, falling toward 0 in the crease where two
  // drops meet and their gradients point against each other. There the normal flips direction
  // across a few pixels, which is what cut the hot underside hard against the neighbour's body.
  float coh = smoothstep(0.35, 0.85, gl / max(gs, 1e-5));
  // true unit surface normal. The earlier g/(gl+0.35) shrank the vector unevenly with
  // gradient strength, which swung the warm band off to one side instead of straight down.
  vec2 nrm = gl > 1e-4 ? g / gl : vec2(0.0, 1.0);
  vec2 Lv = length(ldir) > 1e-4 ? normalize(ldir) : vec2(-0.6, -0.8);
  // key is pinned straight down and never rotates. Tilting it per drop swung the wide band
  // onto the TOP of any drop whose own light vector pointed upward; per-drop variation is a
  // band-WIDTH jitter instead (jit below), so weight varies while direction stays fixed.
  vec2 Ld = vec2(0.0, -1.0);
  float jit = 0.78 + 0.30 * (Lv.x * 0.5 + 0.5);
  // the normal is meaningless at the core where the gradient vanishes, so fade the
  // directional term out toward the middle and let plain depth carry the colour there
  float lit = litB / max(wsum, 1e-6);
  // the light displaces depth itself, so the whole band structure slides in or out around
  // the perimeter: the warm rim runs thick on a drop's shaded side and thin on its lit side,
  // and the core sits off-centre. Each drop carries its own slowly drifting light angle, so
  // no two read alike. Done in the depth domain rather than on the colour, it cannot run off
  // the end of the ramp and clip regions flat the way an additive colour offset did.
  // The light reshapes how depth maps onto the ramp rather than offsetting it. An offset
  // drove sl to zero across the whole underside, so a broad area landed on the palest stop
  // and read as a fat cream shell. As an exponent, sl still reaches 0 only exactly at the
  // surface — cream stays a thin edge — while the exponent decides how much depth the warm
  // stops occupy: stretched under the belly (thick orange/red stack), compressed on top
  // (indigo runs to within a hairline of the edge).
  // 0 on the lit top, 1 on the shaded underside. The normal is meaningless where the
  // gradient vanishes, so toward the core this relaxes to 0 (the indigo end) rather than to
  // a midpoint — relaxing to the middle turned whole interiors warm.
  // narrow angular window: only normals within roughly 50 degrees of straight down open the
  // wide band, so the sides stay thin instead of the whole lower half-space going warm.
  float undf = smoothstep(0.62, -0.95, lit) * (1.0 - smoothstep(0.55, 0.99, s));
  undf *= mix(0.45, 1.0, litScale) * jit;
  // undf sets how much of the depth range the warm stops get before indigo takes over: a
  // hairline on the lit top, most of the body under the belly. An exponent could not do this
  // because the ramp ceiling is only reached at s = 1, so the top edge never got fully indigo.
  // uWarm scales how deep the warm stops reach into the body under the belly
  float band = mix(0.045, max(0.045, 0.82 * uWarm), undf);
  float sd = 0.62 * smoothstep(0.0, band, s);
  // uSmooth blurs the ramp lookup along its own axis: a 7-tap weighted average across a
  // window of depth, so each stop dissolves gradually into the next instead of meeting it
  vec3 inner;
  if (uSmooth > 0.001) {
    float r = 0.16 * uSmooth;
    vec3 acc = vec3(0.0); float wt = 0.0;
    for (int k = -3; k <= 3; k++) {
      float o = float(k) / 3.0;
      float kw = exp(-o * o * 2.2);
      acc += ramp(clamp(sd + o * r, 0.0, 0.62)) * kw;
      wt += kw;
    }
    inner = acc / wt + 0.022;
  } else {
    inner = ramp(clamp(sd, 0.0, 0.62)) + 0.022;
  }

  vec3 n = normalize(vec3(g * 0.5, 1.0));
  vec3 L = normalize(vec3(0.0, -0.72, 0.70));
  // the pale surface band has a fixed field width, so on a small bubble it covers the whole
  // body — scale it down with size so only large blobs get the bright rim
  float und = smoothstep(0.30, -0.95, lit);
  inner += ramp(0.02) * exp(-abs(f - T) * mix(64.0, 42.0, und)) * mix(0.10, 0.58, und) * uRim * litScale;
  // white perimeter glow: a soft near-white bloom hugging the surface all the way round,
  // riding on top of whatever ramp stop is underneath — pale lilac over the indigo top,
  // cream over the warm belly. Tight falloff so it stays an edge, not a wash.
  float edg = exp(-abs(f - T) * 46.0);
  inner += vec3(1.0, 0.96, 0.99) * edg * mix(0.62, 0.70, und) * uRim * litScale;
  // broad pale bloom inside the crown only: a soft whitish-lilac haze that falls away into
  // the violet body, so the top edge reads as a surface curving away rather than a flat cut.
  // Weighted by (1 - und) so it stays on the lit side and never touches the warm belly.
  // driven off normalised depth, not the raw field: a field-domain falloff dies within a
  // few pixels and is size-dependent, giving small drops proportionally more haze. s is 0 at
  // the surface and 1 at the core, so this spans the same fraction of every drop.
  // tied to the lit side and to coherence directly: using (1 - und) let the haze flood the
  // crease once und was masked there, leaving pale patches at every junction
  float crown = (1.0 - smoothstep(0.0, 0.38, s)) * smoothstep(-0.95, 0.30, lit);
  inner += vec3(0.93, 0.90, 1.0) * crown * 0.85 * uRim * litScale;

  // wax shine: broad gloss sheen plus suspended glitter that twinkles
  inner += vec3(1.0, 0.97, 0.94) * pow(max(dot(n, L), 0.0), 6.0) * 0.10 * uShine;
  vec2 id = floor(p * 78.0);
  vec2 fr = fract(p * 78.0);
  float r1 = h21(id), r2 = h21(id + 7.7);
  float tw = 0.45 + 0.55 * sin(uTime * uTwF + r1 * 24.0);
  float spark = smoothstep(0.20, 0.0, length(fr - vec2(r1, r2))) * step(0.80, h21(id + 3.3)) * max(tw, 0.0);
  inner += vec3(1.0, 0.98, 0.95) * spark * smoothstep(0.02, 0.35, s) * 0.85 * uShine;

  float w = max(fwidth(f), uSoft);
  float a = clamp((f - T) / max(w, 1e-5) + 0.5, 0.0, 1.0);
  col = mix(col, inner, a);

  float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  col += (grain - 0.5) * 0.012;
  fragColor = vec4(col, 1.0);
}`;

function hex(h){
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
}

class Component extends DCLogic {
  canvasRef = React.createRef();
  state = { saving: false, recording: 0 };

  renderVals(){
    return {
      canvasRef: this.canvasRef,
      statusLabel: this.state.recording ? 'recording ' + this.state.recording + 's' : (this.state.saving ? 'rendering…' : ''),
      onDownload: () => this.download(),
      onRecord: () => this.recordLoop(),
      scrollMode: this.props.scrollTransition ?? false,
      recordLabel: 'Export ' + Math.round(this.props.loopSeconds ?? 30) + 's loop'
    };
  }

  componentDidMount(){
    this.init();
    this.syncScrollMode();
    // the runway element appears with the tweak, which the template picks up on its own
    this.scrollWatch = setInterval(() => this.syncScrollMode(), 500);
  }

  syncScrollMode(){
    const on = !!document.getElementById('scrollRunway') || (this.props.scrollTransition ?? false);
    document.documentElement.style.overflow = on ? 'auto' : 'hidden';
    document.body.style.overflow = on ? 'auto' : 'hidden';
    document.body.style.height = on ? 'auto' : '100%';
  }

  componentDidUpdate(){
    this.syncScrollMode();
    this.seed();
    this.reseedLoop();
    this.uploadPalette();
  }

  componentWillUnmount(){
    cancelAnimationFrame(this.raf);
    clearInterval(this.scrollWatch);
    document.removeEventListener('visibilitychange', this.onVis);
    window.removeEventListener('resize', this.onResize);
  }

  init(){
    const cv = this.canvasRef.current;
    const gl = cv.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
    if (!gl) return;
    this.gl = gl;
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, mk(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, FRAG));
    gl.bindAttribLocation(prog, 0, 'a');
    gl.linkProgram(prog);
    gl.useProgram(prog);
    this.prog = prog;
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.u = {
      res: gl.getUniformLocation(prog, 'uRes'),
      balls: gl.getUniformLocation(prog, 'uBalls'),
      count: gl.getUniformLocation(prog, 'uCount'),
      rim: gl.getUniformLocation(prog, 'uRim'),
      stops: gl.getUniformLocation(prog, 'uStops'),
      bg: gl.getUniformLocation(prog, 'uBg'),
      ldir: gl.getUniformLocation(prog, 'uLdir'),
      glowSize: gl.getUniformLocation(prog, 'uGlowSize'),
      glowInt: gl.getUniformLocation(prog, 'uGlowInt'),
      soft: gl.getUniformLocation(prog, 'uSoft'),
      shine: gl.getUniformLocation(prog, 'uShine'),
      time: gl.getUniformLocation(prog, 'uTime'),
      lift: gl.getUniformLocation(prog, 'uLift'),
      spread: gl.getUniformLocation(prog, 'uSpread'),
      vign: gl.getUniformLocation(prog, 'uVign'),
      twf: gl.getUniformLocation(prog, 'uTwF'),
      sat: gl.getUniformLocation(prog, 'uSat'),
      spec: gl.getUniformLocation(prog, 'uSpec'),
      warm: gl.getUniformLocation(prog, 'uWarm'),
      smooth: gl.getUniformLocation(prog, 'uSmooth')
    };
    this.data = new Float32Array(288);
    this.ldir = new Float32Array(192);
    this.seed();
    this.seedBubbles();
    this.uploadPalette();
    this.onResize = () => this.resize();
    window.addEventListener('resize', this.onResize);
    this.resize();
    this.t0 = performance.now();
    const loop = () => {
      try { this.draw((performance.now() - this.t0) / 1000); }
      catch (err) { console.error(err); return; }
      this.raf = requestAnimationFrame(loop);
    };
    this.startLoop = loop;
    // a backgrounded tab suspends animation frames; pick the loop back up on return
    this.onVis = () => { if (!document.hidden) { cancelAnimationFrame(this.raf); loop(); } };
    document.addEventListener('visibilitychange', this.onVis);
    loop();
  }

  uploadPalette(){
    const gl = this.gl;
    if (!gl) return;
    const pal = PALETTES[this.props.palette] || PALETTES.Ember;
    gl.uniform3fv(this.u.stops, new Float32Array(pal.stops.flatMap(hex)));
    gl.uniform3fv(this.u.bg, new Float32Array(pal.bg.flatMap(hex)));
  }

  seed(){
    const n = Math.max(3, Math.min(12, Math.round(this.props.blobCount ?? 9)));
    if (this.balls && this.balls.length === n) return;
    let s = 20260814;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    this.balls = Array.from({ length: n }, (_, i) => ({
      x: (-0.5 + (i + 0.5) / n + (rnd() - 0.5) * 0.25 / n) * 2.05,
      period: 38 + rnd() * 30,
      // phases spread evenly so blobs are strung out along the column, never bunched
      phase: (i + 0.5) / n + (rnd() - 0.5) * 0.5 / n,
      sway: 0.015 + rnd() * 0.025,
      px: rnd() * 6.28,
      py: rnd() * 6.28,
      sx: 0.08 + rnd() * 0.14,
      lightAngle: -Math.PI / 2 + (rnd() - 0.5) * 0.18,
      lightDrift: 0,
      r: (i % 4 === 0 ? 0.215 : (i % 3 === 0 ? 0.145 : 0.10)) + rnd() * 0.04
    }));
  }

  seedBubbles(){
    const NB = 84;
    if (this.bubbles) return;
    let s = 91735;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    this.bubbles = Array.from({ length: NB }, (_, i) => {
      const small = Math.pow(rnd(), 1.6);
      return {
        x: (rnd() - 0.5) * 3.0,
        r: 0.022 + small * 0.085,
        // buoyancy: bigger bubbles climb faster
        v: 0.30 + small * 0.85 + rnd() * 0.22,
        phase: (i + 0.5) / NB + (rnd() - 0.5) * 0.6 / NB,
        // its own point in the scroll to arrive at, so they trickle in rather than swell together
        onset: 0.10 + rnd() * 0.52,
        wa: 0.018 + rnd() * 0.055,
        wf: 0.7 + rnd() * 1.9,
        wp: rnd() * 6.28,
        // gurgling comes in surges, so bubbles are grouped into bursts
        burst: i % 5,
        gp: rnd() * 6.28
      };
    });
  }

  reseedLoop(){
    if (this.loopL && this.balls && !this.balls[0].periodQ) {
      this.prepLoop(this.loopL, (performance.now() - this.t0) / 1000);
    }
  }

  resize(){
    const cv = this.canvasRef.current, gl = this.gl;
    if (!cv || !gl) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    gl.viewport(0, 0, cv.width, cv.height);
  }

  draw(t){
    const gl = this.gl, cv = this.canvasRef.current;
    if (!gl) return;
    const sp = this.props.speed ?? 0.55;
    const asp = cv.width / Math.max(cv.height, 1);
    const d = this.data;
    const wide = Math.max(asp, 1) * 0.62;
    const yB = -0.46, yT = 0.42;
    this.balls.forEach((b, i) => {
      const L = this.loopL && b.periodQ ? this.loopL : 0;
      const p = L ? ((t / b.periodQ) + b.phaseL + 1) % 1 : ((t * sp) / b.period + b.phase) % 1;
      let y, lat = 0;
      if (p < 0.46) {                         // warm and buoyant: climbs, slowing as it cools
        y = yB + (yT - yB) * (p / 0.46);
      } else if (p < 0.54) {                  // shedding heat at the top
        y = yT + Math.sin((p - 0.46) * 39) * 0.008;
      } else {                                // denser: sinks along the cooler outer side
        const u = (p - 0.54) / 0.46;
        y = yT - (yT - yB) * (1 - Math.pow(1 - u, 1.35));
        lat = (i % 2 ? 1 : -1) * 0.045 * Math.sin(Math.PI * u);
      }
      // surface tension keeps each drop round — radius holds steady, only a faint wobble
      const r = b.r * (1 + Math.sin(L ? t * b.rW + b.pyL : t * 0.18 * sp + b.py) * 0.04);
      const x = (b.x + lat + Math.sin(L ? t * b.swayW + b.pxL : t * b.sx * sp * 0.3 + b.px) * b.sway) * wide;
      d[i*3] = x; d[i*3+1] = y; d[i*3+2] = r;
      const a = b.lightAngle + t * (L ? b.lightDriftL : b.lightDrift * sp);
      this.ldir[i*2] = Math.cos(a); this.ldir[i*2+1] = Math.sin(a);
    });
    // B: 0 = lava lamp, 1 = full underwater gurgle
    let B = this.props.bubbleAmount ?? 0;
    // if the page can scroll (transition mode), scroll position drives the transition
    const vh = window.innerHeight || 1;
    if (document.getElementById('scrollRunway')) {
      const sy = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
      B = Math.max(B, Math.min(1, Math.max(0, (sy - vh * 0.12) / (vh * 0.80))));
    }
    let count = this.balls.length;
    if (B > 0.002) {
      // the whole body of wax floats up and off the top
      const lift = B * 0.95;
      const shrink = 1 - 0.55 * B;
      for (let i = 0; i < this.balls.length; i++) {
        d[i*3+1] += lift;
        d[i*3+2] *= shrink;
      }
      // clearing line sweeps up from below, emptying the bottom of the frame
      // the bottom only starts emptying in the back half of the scroll
      const clear = -0.60 + Math.max(0, (B - 0.55) / 0.45) * 1.15;
      for (let k = 0; k < this.bubbles.length; k++) {
        const b = this.bubbles[k];
        // each bubble eases in on its own onset, so they arrive scattered across the
        // scroll instead of all 84 swelling on one shared envelope
        const e = Math.max(0, Math.min(1, (B - b.onset) / 0.26));
        const env = e * e * (3 - 2 * e);
        const i = count++;
        // slow, unhurried rise; bursts stagger the columns
        const u = (t * b.v * 0.16 + b.phase + b.burst * 0.17) % 1;
        const y = -0.66 + u * 1.34 + lift * 0.45;
        const x = (b.x + Math.sin(t * b.wf * 0.55 + b.wp) * b.wa
                       + Math.sin(t * b.wf * 0.2 + b.gp) * b.wa * 0.55) * wide;
        // gurgle: size jitter, soft pop at each end, and nothing survives below the line
        const pop = Math.min(1, u / 0.05) * Math.min(1, (1 - u) / 0.10);
        const above = Math.max(0, Math.min(1, (y - clear + 0.10) / 0.22));
        const r = b.r * (0.42 + 0.45 * B) * env * pop * above
                      * (1 + Math.sin(t * 3.4 + b.gp) * 0.08);
        d[i*3] = x; d[i*3+1] = y; d[i*3+2] = r;
        this.ldir[i*2] = 0; this.ldir[i*2+1] = -1;
      }
    }
    gl.uniform2f(this.u.res, cv.width, cv.height);
    gl.uniform3fv(this.u.balls, d);
    gl.uniform2fv(this.u.ldir, this.ldir);
    gl.uniform1i(this.u.count, count);
    gl.uniform1f(this.u.rim, this.props.rimGlow ?? 1);
    gl.uniform1f(this.u.glowSize, this.props.glowSize ?? 6);
    gl.uniform1f(this.u.glowInt, this.props.glowIntensity ?? 1);
    gl.uniform1f(this.u.soft, this.props.edgeBlur ?? 0.02);
    gl.uniform1f(this.u.shine, this.props.shine ?? 0.8);
    gl.uniform1f(this.u.time, t);
    gl.uniform1f(this.u.lift, this.props.bgLift ?? 0.22);
    gl.uniform1f(this.u.spread, this.props.bgSpread ?? 0.5);
    gl.uniform1f(this.u.vign, this.props.bgVignette ?? 1);
    gl.uniform1f(this.u.twf, this.twF ?? 1.8);
    gl.uniform1f(this.u.sat, this.props.saturation ?? 1);
    gl.uniform1f(this.u.spec, this.props.spectrum ?? 0);
    gl.uniform1f(this.u.warm, this.props.warmReach ?? 1);
    gl.uniform1f(this.u.smooth, this.props.warmSmooth ?? 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  prepLoop(L, tNow){
    const sp = this.props.speed ?? 0.55;
    const TAU = Math.PI * 2;
    const quantW = (w) => TAU * Math.round((w * L) / TAU) / L;
    // quantize to whole multiples of L, then re-phase so nothing on screen jumps
    this.balls.forEach((b) => {
      const pNow = ((tNow * sp) / b.period + b.phase) % 1;
      const swayOld = tNow * b.sx * sp * 0.3 + b.px;
      const rOld = tNow * 0.18 * sp + b.py;
      b.periodQ = L / Math.max(1, Math.round(L / (b.period / sp)));
      b.lightDriftL = quantW(b.lightDrift * sp);
      b.swayW = quantW(b.sx * sp * 0.3);
      b.rW = quantW(0.18 * sp);
      b.phaseL = (pNow - tNow / b.periodQ + 1) % 1;
      b.pxL = swayOld - tNow * b.swayW;
      b.pyL = rOld - tNow * b.rW;
    });
    this.twF = quantW(1.8);
    this.loopL = L;
  }

  recordLoop(override){
    const cv = this.canvasRef.current;
    if (!cv || this.state.recording) return;
    const L = Math.round(override || this.props.loopSeconds || 30);
    const tNow = (performance.now() - this.t0) / 1000;
    this.prepLoop(L, tNow);
    cancelAnimationFrame(this.raf);
    // render at full export resolution while recording (CSS size unchanged, so the view still fits)
    const shownW = cv.width, shownH = cv.height;
    const badge = this.props.exportQuality === 'Badge 360² (mp4)';
    let exW, exH, fps, bitrate, type, ext;
    if (badge) {
      exW = exH = 360; fps = 30;
      // stay under 5 MB with headroom
      bitrate = Math.min(2600000, Math.floor((4.4 * 8 * 1024 * 1024) / L));
      type = ['video/mp4;codecs=avc1.4d401e', 'video/mp4;codecs=avc1', 'video/mp4'].find((t) => MediaRecorder.isTypeSupported(t));
      ext = type ? 'mp4' : 'webm';
      if (!type) type = ['video/webm;codecs=vp9', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t));
    } else {
      const targetH = { '1080p': 1080, '1440p': 1440, '4K': 2160 }[this.props.exportQuality ?? '1440p'] || 1440;
      const aspect = cv.clientWidth / Math.max(cv.clientHeight, 1);
      exH = targetH; exW = Math.round(targetH * aspect / 2) * 2;
      fps = 60;
      bitrate = Math.round(exW * exH * fps * 0.12);
      type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t));
      ext = 'webm';
    }
    cv.width = exW; cv.height = exH;
    this.gl.viewport(0, 0, exW, exH);
    // manual frame pump: one captured frame per rendered frame, so the muxed
    // duration is exactly L seconds instead of whatever rAF happened to deliver
    const stream = cv.captureStream(0);
    const track = stream.getVideoTracks()[0];
    const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: bitrate });
    const chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const a = document.createElement('a');
      const blob = new Blob(chunks, { type: ext === 'mp4' ? 'video/mp4' : 'video/webm' });
      a.href = URL.createObjectURL(blob);
      a.download = (badge ? 'lava-badge-360-' : 'lava-loop-') + L + 's.' + ext;
      console.log('export', exW + 'x' + exH, ext, (blob.size / 1048576).toFixed(2) + ' MB');
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 6000);
      clearTimeout(this.timer);
      cv.width = shownW; cv.height = shownH;
      this.gl.viewport(0, 0, shownW, shownH);
      this.setState({ recording: 0 });
      const loop = () => { this.draw((performance.now() - this.t0) / 1000); this.raf = requestAnimationFrame(loop); };
      loop();
    };
    const total = L * fps;
    const t0r = performance.now();
    let frame = 0, shown = -1;
    this.setState({ recording: L });
    rec.start(250);
    const tick = () => {
      if (frame >= total) { setTimeout(() => rec.stop(), 300); return; }
      this.draw(tNow + frame / fps);
      track.requestFrame();
      frame++;
      const left = Math.ceil(L - frame / fps);
      if (left !== shown) { shown = left; this.setState({ recording: Math.max(0, left) }); }
      // pace to real time so frame timestamps land at the right spacing
      const due = t0r + (frame * 1000) / fps;
      this.timer = setTimeout(tick, Math.max(0, due - performance.now()));
    };
    tick();
  }

  download(){
    const cv = this.canvasRef.current, gl = this.gl;
    if (!cv || !gl) return;
    const w = cv.width, h = cv.height;
    this.setState({ saving: true });
    cancelAnimationFrame(this.raf);
    cv.width = 2560; cv.height = 1440;
    gl.viewport(0, 0, 2560, 1440);
    this.draw((performance.now() - this.t0) / 1000);
    cv.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'lava-background-2560x1440.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      cv.width = w; cv.height = h;
      gl.viewport(0, 0, w, h);
      this.setState({ saving: false });
      const loop = () => {
        this.draw((performance.now() - this.t0) / 1000);
        this.raf = requestAnimationFrame(loop);
      };
      loop();
    }, 'image/png');
  }
}

</script>
</body>
</html>
